<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Takip Defteri</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --ink: #14151f;
    --panel: #1c1e2c;
    --hairline: #33364c;
    --hairline-soft: #262838;
    --paper: #edebe4;
    --paper-dim: #9698ac;
    --brass: #c9a34e;
    --brass-dim: #8a744a;
    --coral: #e2604a;
    --azure: #6f97f0;
    --green: #5fbf7a;
    --mono: 'IBM Plex Mono', monospace;
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'IBM Plex Sans', -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ink); color: var(--paper); font-family: var(--sans); }
  .root { max-width: 720px; margin: 0 auto; padding: 28px 20px 60px; }

  .ledger-head { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid var(--hairline); padding-bottom: 18px; margin-bottom: 22px; }
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; color: var(--brass); text-transform: uppercase; margin-bottom: 6px; }
  h1 { font-family: var(--serif); font-weight: 600; font-size: 26px; margin: 0; }
  .level-tag { text-align: right; font-family: var(--mono); font-size: 12px; color: var(--paper-dim); }
  .level-name { font-family: var(--serif); color: var(--brass); font-size: 16px; font-weight: 600; }

  .stat-strip { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 1px; background: var(--hairline); border: 1px solid var(--hairline); margin-bottom: 22px; }
  .stat-cell { background: var(--panel); padding: 14px 16px; }
  .stat-label { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--paper-dim); margin-bottom: 6px; }
  .stat-value { font-family: var(--mono); font-size: 22px; font-weight: 600; }
  .xp-track { height: 6px; background: var(--hairline-soft); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .xp-fill { height: 100%; background: linear-gradient(90deg, var(--brass-dim), var(--brass)); }

  .panel { background: var(--panel); border: 1px solid var(--hairline); padding: 20px; margin-bottom: 18px; }
  .panel.boss { border-color: var(--coral); }
  .panel-title { font-family: var(--serif); font-size: 17px; font-weight: 600; margin: 0 0 4px; }
  .panel-sub { font-size: 13px; color: var(--paper-dim); margin: 0 0 14px; line-height: 1.5; }

  textarea, input[type=text], input[type=password], input[type=number] {
    width: 100%; background: var(--ink); border: 1px solid var(--hairline); color: var(--paper);
    font-family: var(--mono); font-size: 12.5px; padding: 12px; line-height: 1.5;
  }
  textarea { min-height: 110px; resize: vertical; }
  textarea:focus, input:focus { outline: 1px solid var(--azure); }

  .btn { font-family: var(--mono); font-size: 12.5px; letter-spacing: .04em; text-transform: uppercase; padding: 10px 18px; border: 1px solid var(--brass); background: transparent; color: var(--brass); cursor: pointer; margin-top: 14px; }
  .btn:hover:not(:disabled) { background: var(--brass); color: var(--ink); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.secondary { border-color: var(--azure); color: var(--azure); }
  .btn.secondary:hover:not(:disabled) { background: var(--azure); color: var(--ink); }
  .btn.danger { border-color: var(--coral); color: var(--coral); }
  .btn.danger:hover:not(:disabled) { background: var(--coral); color: var(--ink); }
  .btn.ghost { border-color: var(--hairline); color: var(--paper-dim); font-size: 10.5px; padding: 6px 10px; }

  .read-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--hairline-soft); }
  .read-row:last-child { border-bottom: none; }
  .read-row input[type=checkbox] { margin-top: 3px; accent-color: var(--brass); width: 15px; height: 15px; }
  .read-row a { color: var(--paper); font-weight: 600; text-decoration: none; border-bottom: 1px solid var(--brass-dim); }
  .one-liner { font-size: 12.5px; color: var(--paper-dim); margin-top: 3px; }

  .quiz-card { border: 1px solid var(--hairline); padding: 14px 16px; margin-bottom: 12px; }
  .quiz-q { font-size: 14px; font-weight: 500; margin-bottom: 10px; }
  .quiz-opt { display: block; width: 100%; text-align: left; background: var(--ink); border: 1px solid var(--hairline); color: var(--paper); padding: 9px 12px; margin-bottom: 6px; font-family: var(--sans); font-size: 13px; cursor: pointer; }
  .quiz-opt:hover:not(:disabled) { border-color: var(--azure); }
  .quiz-opt.correct { border-color: var(--green); background: rgba(95,191,122,.12); }
  .quiz-opt.wrong { border-color: var(--coral); background: rgba(226,96,74,.12); }
  .quiz-explain { font-size: 12.5px; color: var(--paper-dim); margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--hairline); }
  .tag { display: inline-block; font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 6px; margin-right: 6px; padding: 2px 6px; border: 1px solid currentColor; }
  .tag.bonus { color: var(--coral); }
  .tag.tf { color: var(--azure); }
  .tag.risk { color: var(--brass); }
  .tag.boss { color: var(--coral); }

  .badge-wall { display: flex; flex-wrap: wrap; gap: 10px; }
  .badge { display: flex; align-items: center; gap: 8px; border: 1px solid var(--hairline); padding: 8px 12px; font-family: var(--mono); font-size: 11.5px; color: var(--paper-dim); }
  .badge.earned { border-color: var(--brass); color: var(--brass); }
  .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .history-row { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; padding: 8px 0; border-bottom: 1px solid var(--hairline-soft); color: var(--paper-dim); }
  .history-row .hw { color: var(--paper); }

  .closed-stamp { display: inline-block; border: 2px solid var(--brass); color: var(--brass); font-family: var(--mono); font-size: 13px; letter-spacing: .1em; padding: 6px 14px; transform: rotate(-4deg); margin-top: 10px; }
  .critical-tag { font-family: var(--mono); font-size: 12px; color: var(--azure); margin-top: 8px; }
  .error-box { border: 1px solid var(--coral); color: var(--coral); padding: 10px 12px; font-family: var(--mono); font-size: 12px; margin-top: 10px; }
  .loading-line { font-family: var(--mono); font-size: 12px; color: var(--azure); margin-top: 10px; }
  .empty-hint { font-size: 13px; color: var(--paper-dim); font-style: italic; }
  label.field-label { display: block; font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--paper-dim); margin-bottom: 6px; }

  .match-row { display: flex; gap: 14px; align-items: stretch; margin-bottom: 10px; }
  .match-source { flex: 1; padding: 10px 12px; border: 1px solid var(--hairline); font-size: 13px; display: flex; align-items: center; }
  .match-slot { flex: 1; padding: 10px 12px; border: 1px dashed var(--hairline); font-size: 12.5px; color: var(--paper-dim); cursor: pointer; display: flex; align-items: center; }
  .match-slot.filled { border-style: solid; color: var(--paper); }
  .match-slot.correct { border-color: var(--green); color: var(--green); }
  .match-slot.wrong { border-color: var(--coral); color: var(--coral); }
  .match-pool { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .match-chip { font-family: var(--mono); font-size: 11.5px; border: 1px solid var(--azure); color: var(--azure); padding: 6px 10px; cursor: pointer; }
  .match-chip.selected { background: var(--azure); color: var(--ink); }
  .match-chip.used { opacity: .3; cursor: not-allowed; }

  .speed-banner { display: flex; justify-content: space-between; align-items: center; background: var(--coral); color: var(--ink); font-family: var(--mono); font-size: 13px; padding: 10px 14px; margin-bottom: 14px; position: sticky; top: 0; z-index: 5; }

  .risk-choice-row { display: flex; gap: 10px; }
  .risk-choice-row .btn { margin-top: 0; }
</style>
</head>
<body>
<div class="root" id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect } = React;

const PROFILE_KEY = 'aitakip_profile_v2';
const APIKEY_KEY = 'aitakip_apikey_v1';
const MODEL = 'claude-sonnet-5';
const BOSS_EVERY = 5;
const SPEED_SECONDS = 45;

const LEVEL_TITLES = [
  { min: 0, name: 'Çırak' },
  { min: 100, name: 'Pratisyen' },
  { min: 250, name: 'Kıdemli Pratisyen' },
  { min: 450, name: 'Uzman' },
  { min: 700, name: 'Stratejist' },
  { min: 1000, name: 'Risk + AI Mimarı' },
];
function levelFor(xp) {
  let idx = 0;
  for (let i = 0; i < LEVEL_TITLES.length; i++) if (xp >= LEVEL_TITLES[i].min) idx = i;
  return { level: idx + 1, name: LEVEL_TITLES[idx].name, floor: LEVEL_TITLES[idx].min, next: LEVEL_TITLES[idx + 1] };
}
const BADGE_DEFS = [
  { id: 'ilk-hafta', label: 'İlk Hafta', check: p => p.history.length >= 1 },
  { id: 'seri-3', label: '3 Hafta Seri', check: p => p.streak >= 3 },
  { id: 'seri-5', label: '5 Hafta Seri', check: p => p.streak >= 5 },
  { id: 'seri-10', label: '10 Hafta Seri', check: p => p.streak >= 10 },
  { id: 'mukemmel', label: 'Mükemmel Skor', check: p => p.history.some(h => h.quizTotal > 0 && h.quizScore === h.quizTotal) },
  { id: 'on-hafta', label: '10 Hafta Tamamlandı', check: p => p.history.length >= 10 },
  { id: 'kumarbaz', label: 'Kumarbaz', check: p => p.history.some(h => h.riskWon) },
  { id: 'boss-avcisi', label: 'Boss Avcısı', check: p => p.history.some(h => h.bossCleared) },
];
const EMPTY_PROFILE = { totalXP: 0, streak: 0, lastWeekNumber: 0, history: [], freezes: 0 };

function loadProfile() {
  try {
    const raw = localStorage.getItem(PROFILE_KEY);
    return raw ? { ...EMPTY_PROFILE, ...JSON.parse(raw) } : EMPTY_PROFILE;
  } catch (e) { return EMPTY_PROFILE; }
}
function saveProfileLS(p) {
  localStorage.setItem(PROFILE_KEY, JSON.stringify(p));
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

async function fetchReadable(url) {
  const readerUrl = 'https://r.jina.ai/' + url;
  const res = await fetch(readerUrl);
  if (!res.ok) throw new Error('reader-failed:' + url);
  const text = await res.text();
  return text.slice(0, 6000);
}

const DEMO_WEEK_DATA = {
  isBoss: false,
  week_theme: 'Bu hafta yapay zeka ajanları ve kurumsal iş akışları öne çıktı (DEMO VERİ)',
  must_reads: [
    { title: '[Demo] Kurumsal AI Ajanları Nasıl Çalışır', url: 'https://example.com/demo-1',
      summary: 'Bu demo özet, gerçek bir API çağrısı yapılmadan test amaçlı üretildi. AI ajanları, çok adımlı görevleri araçlar kullanarak otonom şekilde tamamlayabiliyor. Kurumsal kullanımda en büyük risk, yetki sınırlarının net olmamasından kaynaklanıyor. Doğru gözetim mekanizmalarıyla verimlilik belirgin şekilde artıyor.' },
    { title: '[Demo] Üretkenlik Araçlarında AI Entegrasyonu', url: 'https://example.com/demo-2',
      summary: 'İkinci demo kaynak da gerçek veri değildir, sadece arayüzü test etmen için var. Ekipler AI destekli araçları benimsedikçe tekrarlayan işler azalıyor, ama eğitim eksikliği benimsemeyi yavaşlatıyor. Başarılı şirketler küçük pilot gruplarla başlayıp kademeli genişliyor.' },
  ],
  quiz: [
    { source_index: 0, type: 'mc', bonus: false, question: '[Demo] Metne göre AI ajanlarının kurumsal kullanımdaki en büyük riski nedir?', options: ['Maliyet', 'Yetki sınırlarının net olmaması', 'Yavaş çalışması'], correct_index: 1, explanation: 'Demo açıklama: özet metninde bu doğrudan belirtiliyor.' },
    { source_index: 0, type: 'tf', bonus: true, question: '[Demo-BONUS] Bu ifade gerçek bir kaynakta olsaydı, sadece linke tıklayıp okuyarak doğrulanabilirdi: "Ajanlar hiçbir gözetim olmadan güvenli çalışır."', options: ['Doğru', 'Yanlış'], correct_index: 1, explanation: 'Demo açıklama: bonus sorular özetten değil, kaynağın tam metninden çıkar.' },
    { source_index: 1, type: 'mc', bonus: false, question: '[Demo] İkinci kaynağa göre benimsemeyi ne yavaşlatıyor?', options: ['Bütçe', 'Eğitim eksikliği', 'Donanım'], correct_index: 1, explanation: 'Demo açıklama: özet metninde bu doğrudan belirtiliyor.' },
    { source_index: 1, type: 'tf', bonus: true, question: '[Demo-BONUS] "Başarılı şirketler tek seferde büyük ölçekli geçiş yapıyor." ifadesi doğru mu?', options: ['Doğru', 'Yanlış'], correct_index: 1, explanation: 'Demo açıklama: bu bonus soru gerçek senaryoda detaylı okuma gerektirir.' },
  ],
  number_challenge: { source_index: 0, question: '[Demo] Kaynakta örnek olarak verilen verimlilik artışı yüzde kaçtır?', correct_value: 35, tolerance: 5, explanation: 'Demo açıklama: gerçek kaynakta geçen sayı burada sorulur.' },
  matching: { pairs: [ { source_index: 0, detail: 'Yetki sınırı belirsizliği riski' }, { source_index: 1, detail: 'Eğitim eksikliği nedeniyle yavaş benimseme' } ] },
  risk_question: { question: '[Demo-RİSK] Bu hafta hangi yaklaşım daha çok önerildi?', options: ['Büyük patlama geçişi', 'Kademeli pilot yaklaşımı', 'Hiç AI kullanmamak'], correct_index: 1, explanation: 'Demo açıklama: risk sorusu bahis mekaniği için örnek.' },
};

function App() {
  const [apiKey, setApiKey] = useState(() => localStorage.getItem(APIKEY_KEY) || '');
  const [keyDraft, setKeyDraft] = useState('');
  const [profile, setProfile] = useState(loadProfile());
  const [linksText, setLinksText] = useState('');
  const [building, setBuilding] = useState(false);
  const [buildStatus, setBuildStatus] = useState('');
  const [buildError, setBuildError] = useState('');
  const [weekData, setWeekData] = useState(null);
  const [checkedReads, setCheckedReads] = useState({});
  const [quizAnswers, setQuizAnswers] = useState({});
  const [weekClosed, setWeekClosed] = useState(false);
  const [lastGain, setLastGain] = useState(null);
  const [lastCritical, setLastCritical] = useState(false);
  const [lastFreezeEarned, setLastFreezeEarned] = useState(false);

  const [numberGuess, setNumberGuess] = useState('');
  const [shuffledDetails, setShuffledDetails] = useState([]);
  const [matchSelected, setMatchSelected] = useState(null);
  const [matchAssignments, setMatchAssignments] = useState({});
  const [riskChoice, setRiskChoice] = useState(null);
  const [riskAnswer, setRiskAnswer] = useState(null);
  const [bossAnswer, setBossAnswer] = useState(null);
  const [speedActive, setSpeedActive] = useState(false);
  const [speedTimeLeft, setSpeedTimeLeft] = useState(SPEED_SECONDS);
  const [speedResult, setSpeedResult] = useState(null);
  const [lastRiskResult, setLastRiskResult] = useState(null);
  const [lastBossResult, setLastBossResult] = useState(null);

  useEffect(() => {
    if (weekData && weekData.matching && weekData.matching.pairs) {
      setShuffledDetails(shuffle(weekData.matching.pairs.map(p => p.detail)));
    } else {
      setShuffledDetails([]);
    }
  }, [weekData]);

  useEffect(() => {
    if (!speedActive || speedTimeLeft <= 0) return;
    const t = setTimeout(() => setSpeedTimeLeft(s => s - 1), 1000);
    return () => clearTimeout(t);
  }, [speedActive, speedTimeLeft]);

  useEffect(() => {
    if (speedActive && speedTimeLeft <= 0 && speedResult === null) {
      setSpeedActive(false);
      setSpeedResult(false);
    }
  }, [speedActive, speedTimeLeft, speedResult]);

  function saveProfile(next) { setProfile(next); saveProfileLS(next); }

  function saveKey() {
    if (!keyDraft.trim()) return;
    localStorage.setItem(APIKEY_KEY, keyDraft.trim());
    setApiKey(keyDraft.trim());
    setKeyDraft('');
  }

  function changeKey() {
    localStorage.removeItem(APIKEY_KEY);
    setApiKey('');
    setKeyDraft('');
    setBuildError('');
  }

  function resetWeekState() {
    setWeekClosed(false);
    setCheckedReads({});
    setQuizAnswers({});
    setNumberGuess('');
    setMatchSelected(null);
    setMatchAssignments({});
    setRiskChoice(null);
    setRiskAnswer(null);
    setBossAnswer(null);
    setSpeedActive(false);
    setSpeedTimeLeft(SPEED_SECONDS);
    setSpeedResult(null);
    setLastRiskResult(null);
    setLastBossResult(null);
  }

  function loadDemoWeek() {
    setBuildError('');
    resetWeekState();
    setWeekData(DEMO_WEEK_DATA);
  }

  function startSpeedRound() {
    setSpeedActive(true);
    setSpeedTimeLeft(SPEED_SECONDS);
    setSpeedResult(null);
  }

  async function buildWeek() {
    const urls = linksText.split('\n').map(s => s.trim()).filter(Boolean);
    if (urls.length === 0 || !apiKey) return;
    const isBossWeek = (profile.lastWeekNumber + 1) % BOSS_EVERY === 0;
    setBuilding(true);
    setBuildError('');
    setWeekData(null);
    resetWeekState();

    let combined = '';
    for (let i = 0; i < urls.length; i++) {
      setBuildStatus(`${i + 1}/${urls.length} okunuyor: ${urls[i]}`);
      try {
        const text = await fetchReadable(urls[i]);
        combined += `\n\n--- Kaynak ${i}: ${urls[i]} ---\n${text}`;
      } catch (e) {
        combined += `\n\n--- Kaynak ${i}: ${urls[i]} (içerik okunamadı, sadece link olarak dahil et) ---`;
      }
    }

    setBuildStatus('Quiz ve özet hazırlanıyor…');
    try {
      const prompt = `Aşağıda bu haftaki AI/kurumsal dönüşüm kaynaklarının ham metni var (makale, blog, podcast/video sayfası), her biri "--- Kaynak N: url ---" başlığıyla ayrılmış. Bunları işleyip SADECE aşağıdaki şemaya uyan geçerli JSON döndür, başka açıklama, markdown işareti ekleme:

{
  "week_theme": "haftanın öne çıkan temasını özetleyen tek kısa cümle",
  "must_reads": [ { "title": "başlık", "url": "kaynağın orijinal linki", "summary": "4-6 cümlelik gerçek bir özet, kaynağı okumadan da ana fikri anlat" } ],
  "quiz": [ { "source_index": 0, "type": "mc", "bonus": false, "question": "soru metni", "options": ["seçenek1","seçenek2","seçenek3"], "correct_index": 0, "explanation": "kısa açıklama" } ],
  "number_challenge": { "source_index": 0, "question": "kaynakta geçen bir sayıyı soran soru metni", "correct_value": 42, "tolerance": 5, "explanation": "kısa açıklama" },
  "matching": { "pairs": [ { "source_index": 0, "detail": "o kaynağa özgü kısa, ayırt edici bir detay/olgu cümlesi" } ] },
  "risk_question": { "question": "orta-zor bir soru", "options": ["seçenek1","seçenek2","seçenek3"], "correct_index": 0, "explanation": "kısa açıklama" }${isBossWeek ? ',\n  "boss_question": { "question": "birden fazla kaynaktaki bilgiyi birleştirmeyi gerektiren zor bir sentez sorusu", "options": ["seçenek1","seçenek2","seçenek3"], "correct_index": 0, "explanation": "kısa açıklama" }' : ''}
}

Kurallar:
- Her kaynak için bir must_reads öğesi oluştur (sırasıyla index 0,1,2,...).
- Her kaynak için quiz'de "source_index" o kaynağın must_reads içindeki index'ine eşit olan tam olarak 2 soru olsun:
  - 1 tanesi "type": "mc", "bonus": false — cevabı summary'den çıkarılabilecek, genel anlama sorusu, 3 seçenekli.
  - 1 tanesi "type": "tf", "bonus": true — Doğru/Yanlış formatında bir ifade, SADECE kaynağın tam metnindeki spesifik bir detaya dayanmalı, summary'den cevaplanamamalı; "options" tam olarak ["Doğru","Yanlış"] olmalı, "correct_index" 0 (Doğru) veya 1 (Yanlış).
- "number_challenge": haftada sadece 1 tane, kaynaklardan birinde geçen somut bir sayıyı/istatistiği sorsun, makul bir "tolerance" belirle.
- "matching": kaynak sayısı 2 veya daha fazlaysa doldur, "pairs" uzunluğu kaynak sayısına eşit olsun, her "detail" sadece o kaynağa ait, kısa ve ayırt edici olsun (başlığın tekrarı olmasın). Kaynak sayısı 1 ise "pairs": [] olarak boş bırak.
- "risk_question": kaynaklardan herhangi birine dayanan, normal sorulardan biraz daha zor, 3 seçenekli tek bir soru.
${isBossWeek ? '- "boss_question": bu bir BOSS HAFTASI, birden fazla kaynaktaki bilgiyi birlikte kullanmayı gerektiren en zor soruyu üret.' : ''}

Ham içerik:
${combined}`;

      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: MODEL,
          max_tokens: 6000,
          messages: [{ role: 'user', content: prompt }],
        }),
      });
      const data = await response.json();
      if (data.error) {
        if (data.error.type === 'authentication_error') {
          throw Object.assign(new Error('API anahtarı geçersiz veya süresi dolmuş.'), { isAuthError: true });
        }
        throw new Error(data.error.message || 'api-error');
      }
      const textBlock = (data.content || []).find(b => b.type === 'text');
      if (!textBlock) throw new Error('no-text');
      if (data.stop_reason === 'max_tokens') throw new Error('Yanıt çok uzun olduğu için kesildi, daha az link ile tekrar dene');
      let cleaned = textBlock.text.replace(/```json|```/g, '').trim();
      const start = cleaned.indexOf('{');
      const end = cleaned.lastIndexOf('}');
      if (start !== -1 && end !== -1) cleaned = cleaned.slice(start, end + 1);
      cleaned = cleaned.replace(/,(\s*[}\]])/g, '$1');
      const parsed = JSON.parse(cleaned);
      parsed.isBoss = isBossWeek;
      setWeekData(parsed);
    } catch (e) {
      if (e.isAuthError) {
        setBuildError('AUTH_ERROR:' + e.message);
      } else {
        setBuildError('Hafta işlenirken bir sorun oldu: ' + e.message + '. API anahtarını ve linkleri kontrol edip tekrar dener misin?');
      }
    } finally {
      setBuilding(false);
      setBuildStatus('');
    }
  }

  function selectQuizAnswer(qIdx, optIdx) {
    if (quizAnswers[qIdx] !== undefined) return;
    setQuizAnswers(prev => ({ ...prev, [qIdx]: optIdx }));
    checkSpeedDone();
  }

  function selectMatchDetail(detail, used) {
    if (weekClosed || used) return;
    setMatchSelected(detail);
  }
  function assignMatch(sourceIndex) {
    if (weekClosed || !matchSelected) return;
    setMatchAssignments(prev => ({ ...prev, [sourceIndex]: matchSelected }));
    setMatchSelected(null);
    checkSpeedDone();
  }

  function checkSpeedDone() {
    if (!speedActive || !weekData) return;
    setTimeout(() => {
      const allQuizAnswered = weekData.quiz.every((_, i) => quizAnswers[i] !== undefined);
      if (allQuizAnswered && speedActive && speedTimeLeft > 0) {
        setSpeedActive(false);
        setSpeedResult(true);
      }
    }, 0);
  }

  function closeWeek() {
    if (!weekData) return;
    if (riskChoice === 'bet' && riskAnswer === null) return;

    const quizTotal = weekData.quiz.length;
    const quizScore = weekData.quiz.reduce((acc, q, i) => acc + (quizAnswers[i] === q.correct_index ? 1 : 0), 0);
    const quizXP = weekData.quiz.reduce((acc, q, i) => {
      if (quizAnswers[i] !== q.correct_index) return acc;
      return acc + (q.bonus ? 20 : 10);
    }, 0);
    const allReadChecked = weekData.must_reads.every((_, i) => checkedReads[i]);

    let numberCorrect = false;
    if (weekData.number_challenge && numberGuess.trim() !== '') {
      const g = parseFloat(numberGuess);
      const nc = weekData.number_challenge;
      if (!isNaN(g) && Math.abs(g - nc.correct_value) <= (nc.tolerance || 0)) numberCorrect = true;
    }

    let matchCorrectCount = 0;
    const matchPairs = (weekData.matching && weekData.matching.pairs) || [];
    matchPairs.forEach(p => { if (matchAssignments[p.source_index] === p.detail) matchCorrectCount++; });

    let xpBeforeRisk = 20;
    xpBeforeRisk += quizXP;
    if (allReadChecked) xpBeforeRisk += 15;
    if (profile.streak > 0) xpBeforeRisk += 20;
    if (numberCorrect) xpBeforeRisk += 15;
    xpBeforeRisk += matchCorrectCount * 10;
    if (speedResult === true) xpBeforeRisk += 30;

    let bossCleared = false;
    if (weekData.isBoss && weekData.boss_question) {
      bossCleared = bossAnswer === weekData.boss_question.correct_index;
      if (bossCleared) xpBeforeRisk += 30;
    }

    const isCritical = Math.random() < 0.2;
    if (isCritical) xpBeforeRisk = Math.round(xpBeforeRisk * 1.5);

    let xpGain = xpBeforeRisk;
    let riskWon = null;
    if (riskChoice === 'bet' && weekData.risk_question) {
      const betAmount = Math.round(xpBeforeRisk / 2);
      riskWon = riskAnswer === weekData.risk_question.correct_index;
      xpGain = riskWon ? xpBeforeRisk + betAmount : xpBeforeRisk - betAmount;
      if (xpGain < 5) xpGain = 5;
    }

    const nextStreak = profile.streak + 1;
    const earnedFreeze = nextStreak > 0 && nextStreak % 3 === 0;
    const nextWeekNumber = profile.lastWeekNumber + 1;
    const next = {
      totalXP: profile.totalXP + xpGain,
      streak: nextStreak,
      lastWeekNumber: nextWeekNumber,
      freezes: (profile.freezes || 0) + (earnedFreeze ? 1 : 0),
      history: [...profile.history, {
        weekNumber: nextWeekNumber,
        date: new Date().toISOString().slice(0, 10),
        xpEarned: xpGain,
        quizScore, quizTotal,
        weekTheme: weekData.week_theme || '',
        critical: isCritical,
        riskWon,
        bossCleared,
      }],
    };
    setLastGain(xpGain);
    setLastCritical(isCritical);
    setLastFreezeEarned(earnedFreeze);
    setLastRiskResult(riskWon);
    setWeekClosed(true);
    saveProfile(next);
  }

  function useFreeze() {
    if ((profile.freezes || 0) <= 0) return;
    const nextWeekNumber = profile.lastWeekNumber + 1;
    const next = {
      ...profile,
      lastWeekNumber: nextWeekNumber,
      freezes: profile.freezes - 1,
      history: [...profile.history, {
        weekNumber: nextWeekNumber,
        date: new Date().toISOString().slice(0, 10),
        xpEarned: 0,
        quizScore: 0, quizTotal: 0,
        weekTheme: '',
        frozen: true,
      }],
    };
    saveProfile(next);
  }

  function resetProfile() {
    saveProfile(EMPTY_PROFILE);
    setWeekData(null);
    setLinksText('');
    resetWeekState();
  }

  const lvl = levelFor(profile.totalXP);
  const xpSpan = lvl.next ? lvl.next.min - lvl.floor : 1;
  const xpPct = lvl.next ? Math.min(100, Math.round(((profile.totalXP - lvl.floor) / xpSpan) * 100)) : 100;

  if (!apiKey) {
    return (
      <div className="root">
        <div className="ledger-head">
          <div><div className="eyebrow">AI Takip Defteri</div><h1>Kurulum</h1></div>
        </div>
        <div className="panel">
          <p className="panel-title">Anthropic API anahtarı</p>
          <p className="panel-sub">console.anthropic.com üzerinden oluşturduğun anahtarı buraya bir kez gir, tarayıcında saklanacak. Bu anahtar sadece senin bu sayfada yaptığın çağrılarda kullanılır, hiçbir sunucuya gitmez.</p>
          <label className="field-label">API Key</label>
          <input type="password" value={keyDraft} onChange={e => setKeyDraft(e.target.value)} placeholder="sk-ant-..." />
          <button className="btn" onClick={saveKey} disabled={!keyDraft.trim()}>Kaydet ve Başla</button>
        </div>
      </div>
    );
  }

  const usedDetails = new Set(Object.values(matchAssignments));

  return (
    <div className="root">
      {speedActive && (
        <div className="speed-banner">
          <span>⏱ HIZ TURU — tüm soruları bitir, +30 XP kazan</span>
          <strong>{speedTimeLeft}s</strong>
        </div>
      )}

      <div className="ledger-head">
        <div>
          <div className="eyebrow">AI Takip Defteri · No. {String(profile.lastWeekNumber + 1).padStart(3, '0')}</div>
          <h1>Haftalık Denetim Kaydı</h1>
        </div>
        <div className="level-tag">Seviye {lvl.level}<div className="level-name">{lvl.name}</div></div>
      </div>

      <div style={{ textAlign: 'right', marginBottom: 14 }}>
        <button className="btn ghost" onClick={changeKey}>API Anahtarını Değiştir</button>
      </div>

      <div className="stat-strip">
        <div className="stat-cell">
          <div className="stat-label">Toplam XP</div>
          <div className="stat-value">{profile.totalXP}</div>
          <div className="xp-track"><div className="xp-fill" style={{ width: xpPct + '%' }} /></div>
        </div>
        <div className="stat-cell">
          <div className="stat-label">Aktif Seri</div>
          <div className="stat-value">{profile.streak} hafta</div>
        </div>
        <div className="stat-cell">
          <div className="stat-label">Tamamlanan Hafta</div>
          <div className="stat-value">{profile.history.length}</div>
        </div>
        <div className="stat-cell">
          <div className="stat-label">Dondurma Hakkı</div>
          <div className="stat-value">❄ {profile.freezes || 0}</div>
        </div>
      </div>

      <div className="panel">
        <p className="panel-title">Bu Haftanın Linkleri</p>
        <p className="panel-sub">
          Bu hafta okuyacağın/dinleyeceğin makale, blog, podcast veya YouTube linklerini alt alta yapıştır.
          Her 3 haftalık seride bir dondurma hakkı kazanırsın. Her {BOSS_EVERY}. hafta BOSS HAFTASI olur — daha zor, daha ödüllü.
        </p>
        <textarea value={linksText} onChange={e => setLinksText(e.target.value)} placeholder={"https://...\nhttps://...\nhttps://..."} />
        <button className="btn" onClick={buildWeek} disabled={building || !linksText.trim()}>
          {building ? 'İşleniyor…' : 'Haftayı Oluştur'}
        </button>
        <button className="btn ghost" style={{ marginLeft: 10 }} onClick={loadDemoWeek} disabled={building}>
          Demo Verisiyle Test Et (token harcamaz)
        </button>
        {building && <div className="loading-line">{buildStatus}</div>}
        {buildError && buildError.startsWith('AUTH_ERROR:') ? (
          <div className="error-box">
            {buildError.replace('AUTH_ERROR:', '')} Devam etmek için yeni bir anahtar gir.
            <div><button className="btn secondary" style={{ marginTop: 10 }} onClick={changeKey}>Anahtarı Değiştir</button></div>
          </div>
        ) : (
          buildError && <div className="error-box">{buildError}</div>
        )}
        {!weekData && (profile.freezes || 0) > 0 && (
          <div style={{ marginTop: 12 }}>
            <button className="btn ghost" onClick={useFreeze}>❄ Bu Haftayı Dondur ({profile.freezes} hak kaldı, seri bozulmaz)</button>
          </div>
        )}
      </div>

      {weekData && (
        <React.Fragment>
          {weekData.isBoss && (
            <div className="panel boss">
              <p className="panel-title">👑 BOSS HAFTASI</p>
              <p className="panel-sub">Bu hafta her şey daha zor ve daha ödüllü. Kaynakları dikkatlice oku.</p>
            </div>
          )}

          <div className="panel">
            <p className="panel-title">{weekData.week_theme || 'Bu haftanın okumaları'}</p>
            {weekData.must_reads.map((mr, i) => (
              <div className="read-row" key={i}>
                <input type="checkbox" checked={!!checkedReads[i]} disabled={weekClosed}
                  onChange={() => setCheckedReads(prev => ({ ...prev, [i]: !prev[i] }))} />
                <div>
                  {mr.url ? <a href={mr.url} target="_blank" rel="noopener noreferrer">{mr.title}</a> : <strong>{mr.title}</strong>}
                  <div className="one-liner">{mr.summary}</div>
                </div>
              </div>
            ))}
          </div>

          {!speedActive && !weekClosed && (
            <div className="panel">
              <p className="panel-title">⏱ Hız Turu</p>
              <p className="panel-sub">{SPEED_SECONDS} saniyede tüm quiz sorularını bitirirsen +30 XP bonus kazanırsın.</p>
              <button className="btn secondary" onClick={startSpeedRound}>Hız Turunu Başlat</button>
            </div>
          )}

          {weekData.must_reads.map((mr, si) => {
            const sourceQuiz = weekData.quiz
              .map((q, qi) => ({ q, qi }))
              .filter(({ q }) => q.source_index === si);
            if (sourceQuiz.length === 0) return null;
            return (
              <div className="panel" key={si}>
                <p className="panel-title">Sınav · {mr.title}</p>
                {sourceQuiz.map(({ q, qi }) => (
                  <div className="quiz-card" key={qi}>
                    <div className="quiz-q">
                      {q.type === 'tf' && <span className="tag tf">DOĞRU/YANLIŞ</span>}
                      {q.bonus && <span className="tag bonus">BONUS · +20 XP · linke girmen gerekir</span>}
                      <div>{q.question}</div>
                    </div>
                    {q.options.map((opt, oi) => {
                      const answered = quizAnswers[qi] !== undefined;
                      let cls = 'quiz-opt';
                      if (answered && oi === q.correct_index) cls += ' correct';
                      else if (answered && oi === quizAnswers[qi]) cls += ' wrong';
                      return <button key={oi} className={cls} disabled={answered || weekClosed} onClick={() => selectQuizAnswer(qi, oi)}>{opt}</button>;
                    })}
                    {quizAnswers[qi] !== undefined && <div className="quiz-explain">{q.explanation}</div>}
                  </div>
                ))}
              </div>
            );
          })}

          {weekData.number_challenge && (
            <div className="panel">
              <p className="panel-title">🔢 Sayı Tahmini</p>
              <p className="panel-sub">{weekData.number_challenge.question}</p>
              <input type="number" value={numberGuess} disabled={weekClosed}
                onChange={e => setNumberGuess(e.target.value)} placeholder="Tahminin…" />
              {weekClosed && (
                <div className="quiz-explain">
                  Doğru cevap: {weekData.number_challenge.correct_value} (±{weekData.number_challenge.tolerance}). {weekData.number_challenge.explanation}
                </div>
              )}
            </div>
          )}

          {weekData.matching && weekData.matching.pairs && weekData.matching.pairs.length > 0 && (
            <div className="panel">
              <p className="panel-title">🔗 Eşleştirme</p>
              <p className="panel-sub">Önce alttaki detay etiketlerinden birini seç, sonra ait olduğunu düşündüğün kaynağa tıkla.</p>
              {weekData.matching.pairs.map((p, pi) => {
                const assigned = matchAssignments[p.source_index];
                let slotCls = 'match-slot' + (assigned ? ' filled' : '');
                if (weekClosed && assigned) slotCls += assigned === p.detail ? ' correct' : ' wrong';
                return (
                  <div className="match-row" key={pi}>
                    <div className="match-source">{weekData.must_reads[p.source_index] ? weekData.must_reads[p.source_index].title : 'Kaynak ' + p.source_index}</div>
                    <div className={slotCls} onClick={() => assignMatch(p.source_index)}>
                      {assigned || 'Buraya eşleştir…'}
                    </div>
                  </div>
                );
              })}
              <div className="match-pool">
                {shuffledDetails.map((d, di) => {
                  const used = usedDetails.has(d);
                  const cls = 'match-chip' + (matchSelected === d ? ' selected' : '') + (used ? ' used' : '');
                  return <span key={di} className={cls} onClick={() => selectMatchDetail(d, used || weekClosed)}>{d}</span>;
                })}
              </div>
            </div>
          )}

          {weekData.isBoss && weekData.boss_question && (
            <div className="panel boss">
              <p className="panel-title">👑 Boss Sorusu · +30 XP</p>
              <div className="quiz-card">
                <div className="quiz-q"><span className="tag boss">SENTEZ SORUSU</span><div>{weekData.boss_question.question}</div></div>
                {weekData.boss_question.options.map((opt, oi) => {
                  const answered = bossAnswer !== null;
                  let cls = 'quiz-opt';
                  if (answered && oi === weekData.boss_question.correct_index) cls += ' correct';
                  else if (answered && oi === bossAnswer) cls += ' wrong';
                  return <button key={oi} className={cls} disabled={answered || weekClosed} onClick={() => setBossAnswer(oi)}>{opt}</button>;
                })}
                {bossAnswer !== null && <div className="quiz-explain">{weekData.boss_question.explanation}</div>}
              </div>
            </div>
          )}

          {weekData.risk_question && (
            <div className="panel">
              <p className="panel-title">🎲 Çift Yap ya da Kaybet</p>
              <p className="panel-sub">Şu ana kadarki XP kazancının yarısını bahse yatır. Doğru bilirsen bahis miktarın kadar ekstra kazanırsın, yanlış bilirsen o kadar kaybedersin.</p>
              {riskChoice === null && !weekClosed && (
                <div className="risk-choice-row">
                  <button className="btn danger" onClick={() => setRiskChoice('bet')}>Bahse Gir</button>
                  <button className="btn ghost" onClick={() => setRiskChoice('skip')}>Riske Girme</button>
                </div>
              )}
              {riskChoice === 'bet' && (
                <div className="quiz-card">
                  <div className="quiz-q"><span className="tag risk">RİSK SORUSU</span><div>{weekData.risk_question.question}</div></div>
                  {weekData.risk_question.options.map((opt, oi) => {
                    const answered = riskAnswer !== null;
                    let cls = 'quiz-opt';
                    if (answered && oi === weekData.risk_question.correct_index) cls += ' correct';
                    else if (answered && oi === riskAnswer) cls += ' wrong';
                    return <button key={oi} className={cls} disabled={answered || weekClosed} onClick={() => setRiskAnswer(oi)}>{opt}</button>;
                  })}
                  {riskAnswer !== null && <div className="quiz-explain">{weekData.risk_question.explanation}</div>}
                </div>
              )}
              {riskChoice === 'skip' && <p className="one-liner">Riske girmedin, bahis mekaniği bu hafta devre dışı.</p>}
            </div>
          )}

          <div className="panel">
            {!weekClosed ? (
              <button className="btn secondary" onClick={closeWeek} disabled={riskChoice === 'bet' && riskAnswer === null}>Haftayı Kapat ve Damgala</button>
            ) : (
              <div>
                <div className="closed-stamp">ONAYLANDI · +{lastGain} XP</div>
                {lastCritical && <div className="critical-tag">⚡ KRİTİK BAŞARI! 1.5× bonus uygulandı</div>}
                {lastFreezeEarned && <div className="critical-tag">❄ Yeni dondurma hakkı kazandın!</div>}
                {lastRiskResult === true && <div className="critical-tag">🎲 Bahsi kazandın!</div>}
                {lastRiskResult === false && <div className="critical-tag">🎲 Bahsi kaybettin.</div>}
                {speedResult === true && <div className="critical-tag">⏱ Hız turu bonusu kazandın!</div>}
                <p className="panel-sub" style={{ marginTop: 10 }}>Gelecek hafta yeni linkleri yapıştırıp tekrar aç.</p>
              </div>
            )}
          </div>
        </React.Fragment>
      )}

      <div className="panel">
        <p className="panel-title">Rozet Duvarı</p>
        <div className="badge-wall">
          {BADGE_DEFS.map(b => (
            <div key={b.id} className={'badge' + (b.check(profile) ? ' earned' : '')}>
              <span className="badge-dot" />{b.label}
            </div>
          ))}
        </div>
      </div>

      {profile.history.length > 0 && (
        <div className="panel">
          <p className="panel-title">Geçmiş Kayıtlar</p>
          {[...profile.history].reverse().map(h => (
            <div className="history-row" key={h.weekNumber}>
              <span className="hw">Hafta {h.weekNumber} · {h.date}</span>
              <span>
                {h.frozen ? '❄ Donduruldu' : `${h.quizScore}/${h.quizTotal} · +${h.xpEarned} XP${h.critical ? ' ⚡' : ''}${h.bossCleared ? ' 👑' : ''}`}
              </span>
            </div>
          ))}
        </div>
      )}

      {profile.history.length === 0 && !weekData && (
        <p className="empty-hint">Henüz kayıt yok. İlk linklerini yapıştırıp haftayı oluşturduğunda seri burada başlayacak.</p>
      )}

      <div style={{ textAlign: 'right', marginTop: 10 }}>
        <button className="btn ghost" onClick={resetProfile}>Defteri Sıfırla</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
