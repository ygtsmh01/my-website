<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Takip Defteri · Admin</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  :root {
    --ink: #14151f; --panel: #1c1e2c; --hairline: #33364c; --hairline-soft: #262838;
    --paper: #edebe4; --paper-dim: #9698ac; --brass: #c9a34e; --brass-dim: #8a744a;
    --coral: #e2604a; --azure: #6f97f0; --green: #5fbf7a;
    --mono: 'IBM Plex Mono', monospace; --serif: 'Fraunces', Georgia, serif; --sans: 'IBM Plex Sans', -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ink); color: var(--paper); font-family: var(--sans); }
  .root { max-width: 720px; margin: 0 auto; padding: 28px 20px 60px; }
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; color: var(--brass); text-transform: uppercase; margin-bottom: 6px; }
  h1 { font-family: var(--serif); font-weight: 600; font-size: 26px; margin: 0 0 20px; }
  .panel { background: var(--panel); border: 1px solid var(--hairline); padding: 20px; margin-bottom: 18px; }
  .panel-title { font-family: var(--serif); font-size: 17px; font-weight: 600; margin: 0 0 4px; }
  .panel-sub { font-size: 13px; color: var(--paper-dim); margin: 0 0 14px; line-height: 1.5; }
  textarea, input[type=text], input[type=password] {
    width: 100%; background: var(--ink); border: 1px solid var(--hairline); color: var(--paper);
    font-family: var(--mono); font-size: 12.5px; padding: 12px; line-height: 1.5; margin-bottom: 10px;
  }
  textarea { min-height: 110px; resize: vertical; }
  .btn { font-family: var(--mono); font-size: 12.5px; letter-spacing: .04em; text-transform: uppercase; padding: 10px 18px; border: 1px solid var(--brass); background: transparent; color: var(--brass); cursor: pointer; margin-top: 6px; }
  .btn:hover:not(:disabled) { background: var(--brass); color: var(--ink); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.ghost { border-color: var(--hairline); color: var(--paper-dim); font-size: 10.5px; padding: 6px 10px; }
  .error-box { border: 1px solid var(--coral); color: var(--coral); padding: 10px 12px; font-family: var(--mono); font-size: 12px; margin-top: 10px; }
  .ok-box { border: 1px solid var(--green); color: var(--green); padding: 10px 12px; font-family: var(--mono); font-size: 12px; margin-top: 10px; }
  .loading-line { font-family: var(--mono); font-size: 12px; color: var(--azure); margin-top: 10px; }
  label.field-label { display: block; font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--paper-dim); margin-bottom: 6px; }
  .week-row { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; padding: 8px 0; border-bottom: 1px solid var(--hairline-soft); color: var(--paper-dim); }
  a { color: var(--azure); }
</style>
</head>
<body>
<div class="root" id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect } = React;

const SUPABASE_URL = 'https://lhgkfgwtmpfxyxwyaroh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ZElENBh86p0cWQDAnSbNWw_EcOQHmDV';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const MODEL = 'claude-sonnet-5';
const BOSS_EVERY = 5;
const APIKEY_SESSION_KEY = 'aitakip_admin_apikey';

function usernameToEmail(u) { return u.trim().toLowerCase() + '@aitakip-users.com'; }

async function fetchReadable(url) {
  const readerUrl = 'https://r.jina.ai/' + url;
  const res = await fetch(readerUrl);
  if (!res.ok) throw new Error('reader-failed:' + url);
  const text = await res.text();
  return text.slice(0, 6000);
}

function App() {
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);
  const [loadingAuth, setLoadingAuth] = useState(true);
  const [usernameInput, setUsernameInput] = useState('');
  const [passwordInput, setPasswordInput] = useState('');
  const [authError, setAuthError] = useState('');

  const [apiKey, setApiKey] = useState(() => sessionStorage.getItem(APIKEY_SESSION_KEY) || '');
  const [keyDraft, setKeyDraft] = useState('');
  const [linksText, setLinksText] = useState('');
  const [building, setBuilding] = useState(false);
  const [buildStatus, setBuildStatus] = useState('');
  const [buildError, setBuildError] = useState('');
  const [buildOk, setBuildOk] = useState('');
  const [pastWeeks, setPastWeeks] = useState([]);
  const [nextWeekNumber, setNextWeekNumber] = useState(1);

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => {
      setSession(data.session);
      setLoadingAuth(false);
    });
    const { data: sub } = sb.auth.onAuthStateChange((_event, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (!session) { setProfile(null); return; }
    sb.from('profiles').select('*').eq('id', session.user.id).single()
      .then(({ data }) => setProfile(data));
  }, [session]);

  useEffect(() => {
    if (!profile || !profile.is_admin) return;
    sb.from('weeks').select('week_number, week_theme, is_boss, created_at').order('week_number', { ascending: false })
      .then(({ data }) => {
        setPastWeeks(data || []);
        setNextWeekNumber(data && data.length > 0 ? data[0].week_number + 1 : 1);
      });
  }, [profile, buildOk]);

  async function login() {
    setAuthError('');
    const { error } = await sb.auth.signInWithPassword({ email: usernameToEmail(usernameInput), password: passwordInput });
    if (error) setAuthError('Giriş başarısız: ' + error.message);
  }

  async function logout() {
    await sb.auth.signOut();
  }

  function saveKey() {
    if (!keyDraft.trim()) return;
    sessionStorage.setItem(APIKEY_SESSION_KEY, keyDraft.trim());
    setApiKey(keyDraft.trim());
    setKeyDraft('');
  }

  async function buildWeek() {
    const urls = linksText.split('\n').map(s => s.trim()).filter(Boolean);
    if (urls.length === 0 || !apiKey) return;
    const isBossWeek = nextWeekNumber % BOSS_EVERY === 0;
    setBuilding(true);
    setBuildError('');
    setBuildOk('');

    let combined = '';
    for (let i = 0; i < urls.length; i++) {
      setBuildStatus(`${i + 1}/${urls.length} okunuyor: ${urls[i]}`);
      try {
        const text = await fetchReadable(urls[i]);
        combined += `\n\n--- Kaynak ${i}: ${urls[i]} ---\n${text}`;
      } catch (e) {
        combined += `\n\n--- Kaynak ${i}: ${urls[i]} (içerik okunamadı, sadece link olarak dahil et) ---`;
      }
    }

    setBuildStatus('Quiz ve özet hazırlanıyor…');
    try {
      const prompt = `Aşağıda bu haftaki AI/kurumsal dönüşüm kaynaklarının ham metni var (makale, blog, podcast/video sayfası), her biri "--- Kaynak N: url ---" başlığıyla ayrılmış. Bunları işleyip SADECE aşağıdaki şemaya uyan geçerli JSON döndür, başka açıklama, markdown işareti ekleme:

{
  "week_theme": "haftanın öne çıkan temasını özetleyen tek kısa cümle",
  "must_reads": [ { "title": "başlık", "url": "kaynağın orijinal linki", "summary": "4-6 cümlelik gerçek bir özet, kaynağı okumadan da ana fikri anlat" } ],
  "quiz": [ { "source_index": 0, "type": "mc", "bonus": false, "question": "soru metni", "options": ["seçenek1","seçenek2","seçenek3"], "correct_index": 0, "explanation": "kısa açıklama" } ],
  "number_challenge": { "source_index": 0, "question": "kaynakta geçen bir sayıyı soran soru metni", "correct_value": 42, "tolerance": 5, "explanation": "kısa açıklama" },
  "matching": { "pairs": [ { "source_index": 0, "detail": "o kaynağa özgü kısa, ayırt edici bir detay/olgu cümlesi" } ] },
  "risk_question": { "question": "orta-zor bir soru", "options": ["seçenek1","seçenek2","seçenek3"], "correct_index": 0, "explanation": "kısa açıklama" }${isBossWeek ? ',\n  "boss_question": { "question": "birden fazla kaynaktaki bilgiyi birleştirmeyi gerektiren zor bir sentez sorusu", "options": ["seçenek1","seçenek2","seçenek3"], "correct_index": 0, "explanation": "kısa açıklama" }' : ''}
}

Kurallar:
- Her kaynak için bir must_reads öğesi oluştur (sırasıyla index 0,1,2,...).
- Her kaynak için quiz'de "source_index" o kaynağın must_reads içindeki index'ine eşit olan tam olarak 2 soru olsun:
  - 1 tanesi "type": "mc", "bonus": false — cevabı summary'den çıkarılabilecek, genel anlama sorusu, 3 seçenekli.
  - 1 tanesi "type": "tf", "bonus": true — Doğru/Yanlış formatında bir ifade, SADECE kaynağın tam metnindeki spesifik bir detaya dayanmalı, summary'den cevaplanamamalı; "options" tam olarak ["Doğru","Yanlış"] olmalı, "correct_index" 0 (Doğru) veya 1 (Yanlış).
- "number_challenge": haftada sadece 1 tane, kaynaklardan birinde geçen somut bir sayıyı/istatistiği sorsun, makul bir "tolerance" belirle.
- "matching": kaynak sayısı 2 veya daha fazlaysa doldur, "pairs" uzunluğu kaynak sayısına eşit olsun, her "detail" sadece o kaynağa ait, kısa ve ayırt edici olsun. Kaynak sayısı 1 ise "pairs": [] olarak boş bırak.
- "risk_question": kaynaklardan herhangi birine dayanan, normal sorulardan biraz daha zor, 3 seçenekli tek bir soru.
${isBossWeek ? '- "boss_question": bu bir BOSS HAFTASI, birden fazla kaynaktaki bilgiyi birlikte kullanmayı gerektiren en zor soruyu üret.' : ''}

Ham içerik:
${combined}`;

      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({ model: MODEL, max_tokens: 6000, messages: [{ role: 'user', content: prompt }] }),
      });
      const data = await response.json();
      if (data.error) throw new Error(data.error.message || 'api-error');
      const textBlock = (data.content || []).find(b => b.type === 'text');
      if (!textBlock) throw new Error('no-text');
      if (data.stop_reason === 'max_tokens') throw new Error('Yanıt çok uzun olduğu için kesildi, daha az link ile tekrar dene');
      let cleaned = textBlock.text.replace(/```json|```/g, '').trim();
      const start = cleaned.indexOf('{');
      const end = cleaned.lastIndexOf('}');
      if (start !== -1 && end !== -1) cleaned = cleaned.slice(start, end + 1);
      cleaned = cleaned.replace(/,(\s*[}\]])/g, '$1');
      const parsed = JSON.parse(cleaned);

      const { error: insertError } = await sb.from('weeks').insert({
        week_number: nextWeekNumber,
        week_theme: parsed.week_theme,
        must_reads: parsed.must_reads,
        quiz: parsed.quiz,
        number_challenge: parsed.number_challenge || null,
        matching: parsed.matching || null,
        risk_question: parsed.risk_question || null,
        boss_question: parsed.boss_question || null,
        is_boss: isBossWeek,
      });
      if (insertError) throw new Error('Veritabanına yazılamadı: ' + insertError.message);

      setBuildOk(`Hafta ${nextWeekNumber} yayınlandı${isBossWeek ? ' (BOSS HAFTASI)' : ''}.`);
      setLinksText('');
    } catch (e) {
      setBuildError('Hafta işlenirken bir sorun oldu: ' + e.message);
    } finally {
      setBuilding(false);
      setBuildStatus('');
    }
  }

  if (loadingAuth) return <div className="root"><p className="panel-sub">Yükleniyor…</p></div>;

  if (!session) {
    return (
      <div className="root">
        <div className="eyebrow">AI Takip Defteri</div>
        <h1>Admin Girişi</h1>
        <div className="panel">
          <label className="field-label">Kullanıcı Adı</label>
          <input type="text" value={usernameInput} onChange={e => setUsernameInput(e.target.value)} />
          <label className="field-label">Şifre</label>
          <input type="password" value={passwordInput} onChange={e => setPasswordInput(e.target.value)} />
          <button className="btn" onClick={login}>Giriş Yap</button>
          {authError && <div className="error-box">{authError}</div>}
          <p className="panel-sub" style={{ marginTop: 14 }}>Hesabın yoksa önce <a href="index.html">ana sayfadan</a> kayıt ol.</p>
        </div>
      </div>
    );
  }

  if (!profile) return <div className="root"><p className="panel-sub">Profil yükleniyor…</p></div>;

  if (!profile.is_admin) {
    return (
      <div className="root">
        <div className="eyebrow">AI Takip Defteri</div>
        <h1>Admin Girişi</h1>
        <div className="panel">
          <p className="panel-sub">Bu hesap ({profile.username}) admin yetkisine sahip değil.</p>
          <button className="btn ghost" onClick={logout}>Çıkış Yap</button>
        </div>
      </div>
    );
  }

  return (
    <div className="root">
      <div className="eyebrow">AI Takip Defteri · {profile.username}</div>
      <h1>Admin Paneli</h1>
      <div style={{ textAlign: 'right', marginBottom: 14 }}>
        <a href="index.html" className="btn ghost" style={{ textDecoration: 'none', display: 'inline-block' }}>Kullanıcı Paneline Dön</a>
        <button className="btn ghost" style={{ marginLeft: 10 }} onClick={logout}>Çıkış Yap</button>
      </div>

      {!apiKey ? (
        <div className="panel">
          <p className="panel-title">Anthropic API Anahtarı</p>
          <p className="panel-sub">Bu anahtar sadece bu tarayıcı sekmesinde, sayfa kapanana kadar bellekte tutulur (sessionStorage). Veritabanına hiç gitmez.</p>
          <input type="password" value={keyDraft} onChange={e => setKeyDraft(e.target.value)} placeholder="sk-ant-..." />
          <button className="btn" onClick={saveKey} disabled={!keyDraft.trim()}>Kaydet</button>
        </div>
      ) : (
        <div className="panel">
          <p className="panel-title">Hafta {nextWeekNumber} Oluştur{nextWeekNumber % BOSS_EVERY === 0 ? ' — 👑 BOSS HAFTASI' : ''}</p>
          <p className="panel-sub">Bu haftanın linklerini alt alta yapıştır.</p>
          <textarea value={linksText} onChange={e => setLinksText(e.target.value)} placeholder={"https://...\nhttps://...\nhttps://..."} />
          <button className="btn" onClick={buildWeek} disabled={building || !linksText.trim()}>
            {building ? 'İşleniyor…' : `Hafta ${nextWeekNumber}'yi Yayınla`}
          </button>
          <button className="btn ghost" style={{ marginLeft: 10 }} onClick={() => { sessionStorage.removeItem(APIKEY_SESSION_KEY); setApiKey(''); }}>Anahtarı Kaldır</button>
          {building && <div className="loading-line">{buildStatus}</div>}
          {buildError && <div className="error-box">{buildError}</div>}
          {buildOk && <div className="ok-box">{buildOk}</div>}
        </div>
      )}

      <div className="panel">
        <p className="panel-title">Yayınlanan Haftalar</p>
        {pastWeeks.length === 0 && <p className="panel-sub">Henüz hafta yok.</p>}
        {pastWeeks.map(w => (
          <div className="week-row" key={w.week_number}>
            <span>Hafta {w.week_number}{w.is_boss ? ' 👑' : ''} · {w.week_theme}</span>
            <span>{new Date(w.created_at).toLocaleDateString('tr-TR')}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
